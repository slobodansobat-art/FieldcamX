backend:
  name: git-gateway
  branch: main

# Napomena: git-gateway je standardni Decap+Netlify setup.
# Netlify Identity + Git Gateway se podešavaju u sledećoj fazi (deploy),
# ovde je samo konfiguracija kolekcija za sadržaj sajta.

publish_mode: simple
media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "hr"  # Decap nema srpski u latinici; hrvatski je najbliži

collections:
  - name: "hero"
    label: "Hero sekcija"
    files:
      - file: "data/hero.json"
        label: "Hero tekst"
        name: "hero"
        fields:
          - { label: "Naslov", name: "naslov", widget: "string" }
          - { label: "Podnaslov", name: "podnaslov", widget: "text" }
          - { label: "Tekst CTA dugmeta", name: "cta_tekst", widget: "string" }
          - { label: "Link CTA dugmeta", name: "cta_link", widget: "string" }

  - name: "termini"
    label: "Arhiva termina (snimci)"
    files:
      - file: "data/matches.json"
        label: "Termini"
        name: "matches"
        fields:
          - label: "Termini"
            name: "stavke"
            widget: "list"
            label_singular: "Termin"
            summary: "{{fields.balon}} — {{fields.tim1}} vs {{fields.tim2}} ({{fields.datum}})"
            fields:
              - { label: "Balon / hala", name: "balon", widget: "string", hint: "Upiši tačno kao u 'Lista hala' (npr. Altina, SC7, Stracatella, Crveno Crno). Za turnire i ostale hale upiši: Ostalo" }
              - { label: "Datum", name: "datum", widget: "datetime", format: "YYYY-MM-DD", date_format: true, time_format: false, picker_utc: true }
              - { label: "Vreme (opciono, npr. '20:00')", name: "vreme", widget: "string", required: false, pattern: ['^([01]?[0-9]|2[0-3])[:.][0-5][0-9]$', "Upiši vreme kao 20:00"] }
              - { label: "Tim 1", name: "tim1", widget: "string" }
              - { label: "Tim 2", name: "tim2", widget: "string" }
              - { label: "Naslov (opciono, override umesto 'Tim 1 – Tim 2')", name: "naslov", widget: "string", required: false }
              - { label: "YouTube snimak", name: "youtube_id", widget: "string", hint: "Nalepi link snimka sa YouTube-a ili samo ID (11 znakova posle v= u linku)" }
              - { label: "YouTube link (opciono, ako se razlikuje od standardnog youtu.be/ID)", name: "youtube_link", widget: "string", required: false }
              - label: "Golovi (opciono)"
                name: "golovi"
                widget: "list"
                required: false
                label_singular: "Gol"
                hint: "Minut svakog gola u snimku. Na sajtu se pojavljuju kao dugmići koji puštaju snimak od tog trenutka."
                field: { label: "Minut gola (mm:ss, npr. 41:05)", name: "minut", widget: "string", pattern: ['^[0-9]{1,3}:[0-5][0-9]$', "Upiši kao 41:05"] }

  - name: "kalendar"
    label: "Kalendar termina (Zakazivanje)"
    files:
      - file: "data/kalendar.json"
        label: "Kalendar termina"
        name: "kalendar"
        fields:
          - label: "Termini u danu (fiksni, isti raspored svaki dan, npr. '18:00'). Sajt prikazuje sve kao slobodno osim dana upisanih ispod."
            name: "sati"
            widget: "list"
            label_singular: "Termin"
            field: { label: "Vreme (HH:MM)", name: "vreme", widget: "string", pattern: ['^([01]?[0-9]|2[0-3]):[0-5][0-9]$', "Upiši vreme kao 18:00"] }
          - label: "Dani sa zauzetim terminima"
            name: "dani"
            widget: "list"
            label_singular: "Dan"
            summary: "{{fields.datum}}"
            fields:
              - { label: "Datum", name: "datum", widget: "datetime", format: "YYYY-MM-DD", date_format: true, time_format: false, picker_utc: true }
              - label: "Zauzeti termini (moraju se poklapati sa vremenima iz 'Termini u danu' iznad, npr. '18:00')"
                name: "zauzeti"
                widget: "list"
                label_singular: "Zauzet termin"
                field: { label: "Vreme (HH:MM)", name: "vreme", widget: "string", pattern: ['^([01]?[0-9]|2[0-3]):[0-5][0-9]$', "Upiši vreme kao 18:00"] }

  - name: "kontakt"
    label: "Kontakt podaci"
    files:
      - file: "data/contact.json"
        label: "Kontakt podaci"
        name: "contact"
        fields:
          - { label: "Telefon", name: "telefon", widget: "string", required: false, hint: "Npr. 061 324 423. Iz ovog broja se prave i linkovi za poziv i za WhatsApp." }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Instagram nalog (prikaz, npr. @fieldcam_x)", name: "instagram_handle", widget: "string" }
          - { label: "Instagram link", name: "instagram_link", widget: "string" }
          - { label: "YouTube link", name: "youtube_link", widget: "string", required: false }
          - { label: "Radno vreme (opciono)", name: "radno_vreme", widget: "string", required: false, hint: "Malim slovom, jer stoji usred rečenice. Npr. svakog dana od 10 do 22h" }

  - name: "hale"
    label: "Lista hala / lokacija"
    files:
      - file: "data/venues.json"
        label: "Lista hala"
        name: "venues"
        fields:
          - label: "Hale"
            name: "stavke"
            widget: "list"
            label_singular: "Hala"
            summary: "{{fields.naziv}}"
            fields:
              - { label: "Naziv hale", name: "naziv", widget: "string" }
              - { label: "Adresa (opciono)", name: "adresa", widget: "string", required: false }

  - name: "cta"
    label: "CTA linkovi"
    files:
      - file: "data/cta-links.json"
        label: "CTA linkovi"
        name: "cta-links"
        fields:
          - { label: "Instagram DM link", name: "instagram_dm", widget: "string", required: false, hint: "Link za dugmad 'Piši na Instagramu', npr. https://www.instagram.com/fieldcam_x/ (ig.me linkovi znaju da ne rade na računaru). Telefon i WhatsApp se menjaju u 'Kontakt podaci'." }

